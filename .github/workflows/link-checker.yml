name: Check Links
on:
  schedule:
    - cron: "0 0 * * 0" # Runs every Sunday at midnight
  pull_request:
    paths:
      - "**/*.md"
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept 200,204,429 --verbose --no-progress '**/*.md'
          fail: true
